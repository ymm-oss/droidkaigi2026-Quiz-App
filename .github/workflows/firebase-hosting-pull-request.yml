# Generated by `firebase init hosting:github`, adapted for Wasm (Gradle prod build).
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - "wasmApp/**"
      - "composeApp/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-pull-request.yml"
      - ".github/workflows/firebase-hosting-merge.yml"

concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Require GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON is required for prod Wasm Hosting builds." >&2
            exit 1
          fi

      - name: Write google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p androidApp/src/prod
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > androidApp/src/prod/google-services.json

      - name: Build Wasm distribution (prod)
        run: >
          ./gradlew :wasmApp:wasmJsBrowserDistribution
          -Pquiz.runtime=prod
          --no-daemon

      - name: Verify hosting artifact
        run: test -f wasmApp/build/dist/wasmJs/productionExecutable/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to preview channel
        env:
          SA_YMM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YMM_DROIDKAIGI26 }}
          SA_INIT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DROIDKAIGI26 }}
          SA_SHARED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CREDS=""
          if [ -n "$SA_YMM" ]; then
            CREDS="$SA_YMM"
          elif [ -n "$SA_SHARED" ]; then
            CREDS="$SA_SHARED"
          elif [ -n "$SA_INIT" ]; then
            CREDS="$SA_INIT"
          else
            echo "Missing Firebase service account secret for Hosting deploy." >&2
            echo "Set one of: FIREBASE_SERVICE_ACCOUNT_YMM_DROIDKAIGI26, FIREBASE_SERVICE_ACCOUNT_DROIDKAIGI26, FIREBASE_SERVICE_ACCOUNT" >&2
            exit 1
          fi
          printf '%s\n' "$CREDS" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          CHANNEL="pr${{ github.event.pull_request.number }}"
          if ! npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
            --expires 30d \
            --project ymm-droidkaigi26 \
            --json > "$RUNNER_TEMP/deploy.json" 2> "$RUNNER_TEMP/deploy.err"; then
            cat "$RUNNER_TEMP/deploy.err" >&2
            cat "$RUNNER_TEMP/deploy.json" >&2 || true
            exit 1
          fi
          URL="$(
            node -e "
              const payload = require(process.argv[1]);
              const result = payload.result;
              const entry = Array.isArray(result)
                ? result[0]
                : result && typeof result === 'object'
                  ? Object.values(result)[0]
                  : undefined;
              process.stdout.write(entry?.url ?? '');
            " "$RUNNER_TEMP/deploy.json"
          )"
          if [ -n "$URL" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "Firebase Hosting preview: ${URL}"
          fi
