# Generated by `firebase init hosting:github`, adapted for Wasm (Gradle prod build).
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - "wasmApp/**"
      - "composeApp/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-pull-request.yml"
      - ".github/workflows/firebase-hosting-merge.yml"

concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Require GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON is required for prod Wasm Hosting builds." >&2
            exit 1
          fi

      - name: Write google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p androidApp/src/prod
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > androidApp/src/prod/google-services.json

      - name: Build Wasm distribution (prod)
        run: >
          ./gradlew :wasmApp:wasmJsBrowserDistribution
          -Pquiz.runtime=prod
          --no-daemon

      - name: Verify hosting artifact
        run: test -f wasmApp/build/dist/wasmJs/productionExecutable/index.html

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DROIDKAIGI26 }}
          expires: 30d
          projectId: droidkaigi26
