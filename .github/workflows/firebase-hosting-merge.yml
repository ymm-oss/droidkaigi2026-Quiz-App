# Generated by `firebase init hosting:github`, adapted for Wasm (Gradle prod build).
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [master]
    paths:
      - "wasmApp/**"
      - "composeApp/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-pull-request.yml"
      - ".github/workflows/firebase-hosting-merge.yml"
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Require GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON is required for prod Wasm Hosting builds." >&2
            exit 1
          fi

      - name: Write google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p androidApp/src/prod
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > androidApp/src/prod/google-services.json

      - name: Build Wasm distribution (prod)
        run: >
          ./gradlew :wasmApp:wasmJsBrowserDistribution
          -Pquiz.runtime=prod
          --no-daemon

      - name: Verify hosting artifact
        run: test -f wasmApp/build/dist/wasmJs/productionExecutable/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to live channel
        env:
          SA_YMM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YMM_DROIDKAIGI26 }}
          SA_INIT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DROIDKAIGI26 }}
          SA_SHARED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          CREDS=""
          if [ -n "$SA_YMM" ]; then
            CREDS="$SA_YMM"
          elif [ -n "$SA_SHARED" ]; then
            CREDS="$SA_SHARED"
          elif [ -n "$SA_INIT" ]; then
            CREDS="$SA_INIT"
          else
            echo "Missing Firebase service account secret for Hosting deploy." >&2
            echo "Set one of: FIREBASE_SERVICE_ACCOUNT_YMM_DROIDKAIGI26, FIREBASE_SERVICE_ACCOUNT_DROIDKAIGI26, FIREBASE_SERVICE_ACCOUNT" >&2
            exit 1
          fi
          printf '%s\n' "$CREDS" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@latest deploy --only hosting --project ymm-droidkaigi26
