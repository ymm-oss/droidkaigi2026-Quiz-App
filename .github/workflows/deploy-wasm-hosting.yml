name: Deploy Wasm (Firebase Hosting)

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - "wasmApp/**"
      - "composeApp/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-wasm-hosting.yml"
  push:
    branches: [master]
    paths:
      - "wasmApp/**"
      - "composeApp/**"
      - "core/**"
      - "feature/**"
      - "build-logic/**"
      - "gradle/**"
      - "kotlin-js-store/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-wasm-hosting.yml"
  workflow_dispatch:

concurrency:
  group: deploy-wasm-hosting-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Require GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON is required for prod Wasm Hosting builds." >&2
            exit 1
          fi

      - name: Require FIREBASE_SERVICE_ACCOUNT secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT is required for Firebase Hosting deploy." >&2
            exit 1
          fi

      - name: Write google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p androidApp/src/prod
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > androidApp/src/prod/google-services.json

      - name: Build Wasm distribution (prod)
        run: >
          ./gradlew :wasmApp:wasmJsBrowserDistribution
          -Pquiz.runtime=prod
          --no-daemon

      - name: Verify hosting artifact
        run: test -f wasmApp/build/dist/wasmJs/productionExecutable/index.html

      - name: Deploy preview channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: droidkaigi26
          expires: 30d

      - name: Deploy live channel
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: droidkaigi26
          channelId: live
