name: CI

on:
  pull_request:
    branches: [master]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "core/**"
      - "desktopApp/**"
      - "feature/**"
      - "staffComposeApp/**"
      - "staffDesktopApp/**"
      - "wasmApp/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "config/detekt/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [master]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "core/**"
      - "desktopApp/**"
      - "feature/**"
      - "staffComposeApp/**"
      - "staffDesktopApp/**"
      - "wasmApp/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - "config/detekt/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests
        run: ./gradlew :core:domain:jvmTest :core:data:jvmTest --no-daemon

  ui-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: JVM Compose UI smoke
        run: xvfb-run --auto-servernum ./gradlew :feature:quiz:jvmTest :feature:staff:jvmTest --no-daemon
      - name: Upload staff screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-screenshots
          path: docs/screenshots/staff/*.png
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble fake debug
        run: ./gradlew :androidApp:assembleFakeDebug --no-daemon

  ui-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: aosp_atd
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >
            ./gradlew :androidApp:connectedFakeDebugAndroidTest
            --no-daemon

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Wasm (fake)
        run: ./gradlew :wasmApp:compileKotlinWasmJs --no-daemon

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Detekt
        run: ./gradlew detektAll --no-daemon
